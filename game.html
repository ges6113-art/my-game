<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 돌림판</title>
    <style>
        /* 전체 화면 중앙 정렬 및 미니멀한 배경 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fafafa;
            color: #222;
        }

        /* 돌림판과 화살표를 감싸는 컨테이너 */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 24px;
        }

        /* 상단 고정 핀(화살표) */
        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #222;
            z-index: 10;
        }

        /* 반반 나뉜 원판 (왼쪽: 당첨, 오른쪽: 꽝) */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #222;
            box-sizing: border-box;
            position: relative;
            /* 0~180도(오른쪽 반원)는 연회색(꽝), 180~360도(왼쪽 반원)는 흰색(당첨) */
            background: conic-gradient(
                #e5e7eb 0deg 180deg,
                #ffffff 180deg 360deg
            );
            /* 부드러운 감속 회전 애니메이션 */
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        /* 원판 중앙을 가르는 세로선 */
        .wheel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background-color: #222;
            transform: translateX(-50%);
        }

        /* 당첨 / 꽝 텍스트 공통 스타일 */
        .label {
            position: absolute;
            top: 50%;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
        }

        /* 왼쪽 반원 중앙에 '당첨' 배치 */
        .label-win {
            left: 25%;
            transform: translate(-50%, -50%);
        }

        /* 오른쪽 반원 중앙에 '꽝' 배치 */
        .label-lose {
            left: 75%;
            transform: translate(-50%, -50%);
        }

        /* 돌리기 버튼 스타일 */
        button {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #222;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            background-color: #444;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        /* 결과 텍스트 표시 영역 */
        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            height: 30px; /* 텍스트가 없을 때도 높이 유지 */
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <span class="label label-win">당첨</span>
            <span class="label label-lose">꽝</span>
        </div>
    </div>

    <button id="spinBtn">돌리기</button>
    <div class="result" id="result"></div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultText = document.getElementById('result');

        let currentRotation = 0; // 누적 회전 각도
        let isSpinning = false;  // 회전 중 여부 체크

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;

            isSpinning = true;
            spinBtn.disabled = true;
            resultText.textContent = '';

            // [핵심 로직: 무조건 '꽝'에 멈추게 하기]
            // 원판 초기 상태에서 오른쪽(0도 ~ 180도)이 '꽝' 영역입니다.
            // 상단 포인터(0도 위치) 아래에 '꽝' 영역이 오려면,
            // 원판이 시계 방향으로 180도 ~ 360도만큼 회전한 상태가 되어야 합니다.
            // 경계선에 걸리지 않도록 200도 ~ 340도 사이의 각도를 목표 지점으로 설정합니다.
            const targetAngle = Math.floor(Math.random() * 140) + 200;

            // 최소 5바퀴(1800도) 이상 회전하도록 계산
            const baseSpins = 360 * 5;
            const currentMod = currentRotation % 360;
            
            // 현재 각도에서 목표 각도(targetAngle)에 정확히 도달하기 위한 추가 회전량 계산
            let delta = targetAngle - currentMod;
            if (delta < 0) {
                delta += 360;
            }

            currentRotation += baseSpins + delta;

            // CSS transform으로 회전 실행
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // 애니메이션 시간(3초)이 끝난 후 결과 표시
            setTimeout(() => {
                resultText.textContent = '꽝';
                isSpinning = false;
                spinBtn.disabled = false;
            }, 3000);
        });
    </script>
